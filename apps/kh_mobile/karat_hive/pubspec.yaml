name: karat_hive
description: Karat Hive — dual-mode Customer / Vendor mobile app.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  file_picker: ^8.1.4
  dio: ^5.7.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  firebase_analytics: ^12.5.0
  url_launcher: ^6.3.1
  kh_core:
    path: ../../../packages/kh_core
  kh_domain:
    path: ../../../packages/kh_domain
  kh_api:
    path: ../../../packages/kh_api
  kh_design_system:
    path: ../../../packages/kh_design_system
  kh_ui_domain:
    path: ../../../packages/kh_ui_domain
  kh_l10n:
    path: ../../../packages/kh_l10n

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
