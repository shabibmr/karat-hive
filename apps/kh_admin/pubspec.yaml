name: kh_admin
description: "Karat Hive Admin Portal (Flutter Web)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^9.2.2
  intl: any
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.6.0
  fl_chart: ^1.1.0
  web: ^1.0.0

  kh_core:
    path: ../../packages/kh_core
  kh_domain:
    path: ../../packages/kh_domain
  kh_api:
    path: ../../packages/kh_api
  kh_design_system:
    path: ../../packages/kh_design_system
  kh_ui_domain:
    path: ../../packages/kh_ui_domain
  kh_l10n:
    path: ../../packages/kh_l10n

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_lint: ^2.6.1
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
  generate: true
