<section class="screen" data-screen="CUS-S21" data-title="Settings">
  <div class="screen-block">
    <div class="section-label">Preferences &amp; Security</div>
    <h1 class="screen-heading">Settings</h1>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h3 class="section-title" style="font-size:1.1rem">Application Preferences</h3>

    <div class="field">
      <label class="field-label">Language</label>
      <select>
        <option selected>English</option>
        <option>العربية (Arabic - RTL)</option>
      </select>
    </div>

    <div class="field">
      <label class="field-check">
        <input type="checkbox" checked />
        <span>Push Notifications for New Offers &amp; Expiries</span>
      </label>
    </div>

    <div class="field">
      <label class="field-check">
        <input type="checkbox" checked />
        <span>Enable Biometric FaceID / TouchID Unlock</span>
      </label>
    </div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <h3 class="section-title" style="font-size:1.1rem">Legal &amp; Support</h3>
    <div class="field-row"><a href="#">Terms of Service</a><span>›</span></div>
    <div class="field-row"><a href="#">Privacy Policy &amp; Data Rights</a><span>›</span></div>
    <div class="field-row"><a href="#">Help Centre &amp; WhatsApp Support</a><span>›</span></div>
    <div class="field-row"><span class="field-hint">App Version</span><span>1.0.0 (Build 2026.08)</span></div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-secondary btn-block" id="btn-logout-settings">Sign Out</button>
    <button type="button" class="btn btn-ghost btn-block" style="color:var(--error)">Deactivate Account</button>
  </div>
</section>
