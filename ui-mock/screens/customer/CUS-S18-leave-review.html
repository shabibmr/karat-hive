<section class="screen" data-screen="CUS-S18" data-title="Leave Review">
  <div class="screen-block">
    <div class="section-label">Jeweller Feedback</div>
    <h1 class="screen-heading">Leave Review</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Share your experience with Al Noor Jewellery for connection KH-CN-2026-00881.</p>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:1rem">
      <img src="assets/images/showroom.jpg" alt="Vendor" style="width:48px;height:48px;border-radius:50%;object-fit:cover" />
      <div>
        <strong style="color:var(--gold-200);font-size:1.1rem">Al Noor Jewellery</strong>
        <div class="field-hint">Ahmed Hassan · Deira, Dubai</div>
      </div>
    </div>

    <div class="form-section" style="border:none;padding-bottom:0;margin-bottom:0">
      <div class="field">
        <label class="field-label">Overall Rating <span class="field-hint">*</span></label>
        <div class="stars" style="font-size:1.8rem;cursor:pointer;letter-spacing:6px">★★★★★</div>
        <div class="field-hint">Tap to rate (5 of 5 stars selected)</div>
      </div>

      <div class="field" style="margin-top:1rem">
        <label class="field-label">Written Review</label>
        <textarea rows="4" placeholder="Describe craftsmanship quality, pricing transparency, punctuality, and staff courtesy...">Exceptional craftsmanship and smooth transaction. The 22K necklace matched the description perfectly and was delivered right on time.</textarea>
        <div class="field-hint">Max 1000 characters. Reviews are held briefly for platform moderation before publishing.</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="CUS-S15">Submit Review →</button>
    <button type="button" class="btn btn-secondary btn-block" data-nav="CUS-S15">Cancel</button>
  </div>
</section>
