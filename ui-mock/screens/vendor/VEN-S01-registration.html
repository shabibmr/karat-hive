<section class="screen" data-screen="VEN-S01" data-title="Vendor Registration">
  <div class="screen-block">
    <div class="section-label">Vendor Onboarding · Step 1 of 2</div>
    <h1 class="screen-heading">Business Registration</h1>
    <div class="progress-bar" style="margin-bottom:1.25rem"><span style="width:50%"></span></div>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h2 class="section-title" style="font-size:1.1rem">1. Business Profile</h2>
    
    <div class="field">
      <label class="field-label">Legal Business Name <span class="field-hint">*</span></label>
      <input type="text" value="Al Noor Jewellery LLC" placeholder="Legal entity name on trade licence" />
    </div>

    <div class="field">
      <label class="field-label">Public Trading Name <span class="field-hint">*</span></label>
      <input type="text" value="Al Noor Jewellery" placeholder="Name displayed to customers" />
    </div>

    <div class="field" style="grid-template-columns: 1fr 1fr; display: grid; gap: 8px;">
      <div>
        <label class="field-label">Trade Licence No. <span class="field-hint">*</span></label>
        <input type="text" value="CN-1092834" />
      </div>
      <div>
        <label class="field-label">Licence Expiry <span class="field-hint">*</span></label>
        <input type="date" value="2027-06-30" />
      </div>
    </div>

    <div class="field">
      <label class="field-label">Emirate / Primary Region <span class="field-hint">*</span></label>
      <select>
        <option selected>Dubai (Deira Gold Souk)</option>
        <option>Abu Dhabi</option>
        <option>Sharjah</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Showroom Address</label>
      <input type="text" value="Shop 14, Gold Centre Building, Sikkat Al Khail Rd, Deira, Dubai" />
    </div>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h2 class="section-title" style="font-size:1.1rem">2. Authorised Contact</h2>

    <div class="field">
      <label class="field-label">Contact Person Name <span class="field-hint">*</span></label>
      <input type="text" value="Ahmed Hassan" />
    </div>

    <div class="field">
      <label class="field-label">Business Mobile Number <span class="field-hint">*</span></label>
      <input type="tel" value="+971 4 555 0101" />
    </div>

    <div class="field">
      <label class="field-label">Business Email <span class="field-hint">*</span></label>
      <input type="email" value="contact@alnoorjewellery.ae" />
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="VEN-S02">Continue to KYC Document Upload →</button>
  </div>
</section>
