<section class="screen vendor-dense" data-screen="VEN-S19" data-title="Customer Feedback">
  <div class="screen-block">
    <div class="section-label">Transaction Feedback</div>
    <h1 class="screen-heading">Customer Feedback</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Leave internal rating and feedback for customer connection KH-CN-2026-00881 (Sara Al Maktoum).</p>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <div class="field">
      <label class="field-label">Transaction Outcome <span class="field-hint">*</span></label>
      <select>
        <option selected>Completed Successfully (Deal Finalized)</option>
        <option>Customer Cancelled / Changed Mind</option>
        <option>Customer Unresponsive on WhatsApp</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Customer Rating</label>
      <div class="stars" style="font-size:1.6rem;cursor:pointer">★★★★★</div>
    </div>

    <div class="field">
      <label class="field-label">Internal Notes</label>
      <textarea rows="3" placeholder="Provide notes regarding meeting punctuality or transaction details..."></textarea>
      <div class="field-hint">Visible to Platform Admin for trust scoring.</div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="VEN-S13">Submit Feedback →</button>
  </div>
</section>
