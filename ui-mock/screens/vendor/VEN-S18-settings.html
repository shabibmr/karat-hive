<section class="screen vendor-dense" data-screen="VEN-S18" data-title="Settings">
  <div class="screen-block">
    <div class="section-label">Vendor System Preferences</div>
    <h1 class="screen-heading">Settings</h1>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h3 class="section-title" style="font-size:1.1rem">Notification Channels</h3>

    <div class="field">
      <label class="field-check">
        <input type="checkbox" checked />
        <span>Instant Push Notifications for New Matched Requests</span>
      </label>
    </div>

    <div class="field">
      <label class="field-check">
        <input type="checkbox" checked />
        <span>SMS Alerts for Offer Acceptance &amp; Identity Reveals</span>
      </label>
    </div>

    <div class="field">
      <label class="field-label">Quiet Hours (Pause Feed Sounds)</label>
      <input type="text" value="11:00 PM - 07:00 AM GST" />
    </div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <h3 class="section-title" style="font-size:1.1rem">Account &amp; Security</h3>
    <div class="field-row"><a href="#">Change Password</a><span>›</span></div>
    <div class="field-row"><a href="#">Vendor Terms of Service</a><span>›</span></div>
    <div class="field-row"><a href="#">KYC Document Status</a><span class="status-chip status-success">Verified</span></div>
    <div class="field-row"><span class="field-hint">App Version</span><span>1.0.0 (Vendor Mode)</span></div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-secondary btn-block">Sign Out of Vendor Account</button>
  </div>
</section>
