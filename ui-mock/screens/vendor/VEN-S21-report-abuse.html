<section class="screen vendor-dense" data-screen="VEN-S21" data-title="Report Abuse">
  <div class="screen-block">
    <div class="section-label">Trust &amp; Safety</div>
    <h1 class="screen-heading">Report Request / Customer</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Report non-genuine requests, suspicious activity, or inappropriate communication.</p>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <div class="field">
      <label class="field-label">Report Reason <span class="field-hint">*</span></label>
      <select>
        <option selected>Non-genuine / Fake Request Specifications</option>
        <option>Attempted External Off-platform Fraud</option>
        <option>Abusive or Spam Communication</option>
        <option>Other Policy Violation</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Explanation &amp; Context</label>
      <textarea rows="4" placeholder="Provide details for Admin review..."></textarea>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="VEN-S13">Submit Report →</button>
    <button type="button" class="btn btn-secondary btn-block" data-nav="VEN-S13">Cancel</button>
  </div>
</section>
