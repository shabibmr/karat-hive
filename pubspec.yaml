name: karat_hive_workspace
description: Karat Hive Flutter monorepo root (Melos + Dart pub workspace, AD-FE-02).
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

# Dart pub workspace. kh_admin is intentionally excluded until the Admin vertical
# starts (it is still a stock `flutter create` project).
workspace:
  - apps/kh_mobile/karat_hive
  - packages/kh_core
  - packages/kh_domain
  - packages/kh_api
  - packages/kh_design_system
  - packages/kh_l10n
  - packages/kh_ui_domain

dev_dependencies:
  melos: ^8.0.0

melos:
  scripts:
    analyze:
      exec: dart analyze
      description: Static analysis including hardcoded_strings_lint (use dart analyze, not flutter analyze).
    gen:
      exec:
        command: dart run build_runner build
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Run freezed / json_serializable codegen in packages that declare build_runner.
    gen-l10n:
      exec: flutter gen-l10n
      packageFilters:
        scope: kh_l10n
      description: Regenerate packages/kh_l10n AppLocalizations from ARB (CP2-F05). Must run in-package; --project-dir from workspace root rejects generate:true.
    test:
      exec: flutter test
      packageFilters:
        dirExists: test
      description: Run tests in every package that has a test/ directory.
