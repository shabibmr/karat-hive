<section class="screen vendor-dense" data-screen="VEN-S15" data-title="Business Profile">
  <div class="screen-block">
    <div class="section-label">Jeweller Credentials</div>
    <h1 class="screen-heading">Business Profile</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Manage public jeweller profile details and verified trade licence information.</p>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h2 class="section-title" style="font-size:1.1rem">Showroom &amp; Branding</h2>
    <div style="margin-bottom:1rem">
      <img src="assets/images/showroom.jpg" alt="Showroom interior" style="width:100%;height:160px;object-fit:cover;border-radius:12px;border:1px solid var(--border-standard)" />
    </div>

    <div class="field">
      <label class="field-label">Public Trading Name</label>
      <input type="text" value="Al Noor Jewellery" />
    </div>

    <div class="field">
      <label class="field-label">Showroom Description</label>
      <textarea rows="3">Premier Deira Gold Souk jeweller specializing in 22K handcrafted bridal sets, certified diamond ornaments, and investment bullion.</textarea>
    </div>

    <div class="field">
      <label class="field-label">Showroom Hours</label>
      <input type="text" value="Mon-Sat: 09:30 AM - 10:00 PM | Sun: 04:00 PM - 09:30 PM" />
    </div>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h2 class="section-title" style="font-size:1.1rem">Verification &amp; Licence</h2>
    <div class="field-row">
      <span class="field-label">Legal Name</span>
      <strong>Al Noor Jewellery LLC</strong>
    </div>
    <div class="field-row">
      <span class="field-label">Trade Licence</span>
      <strong>CN-1092834 (Dubai DED)</strong>
    </div>
    <div class="field-row">
      <span class="field-label">Verification State</span>
      <span class="status-chip status-success">● VERIFIED &amp; ACTIVE</span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light">Save Profile Edits</button>
    <button type="button" class="btn btn-secondary btn-block" data-nav="VEN-S16">Manage Categories &amp; Regions →</button>
  </div>
</section>
