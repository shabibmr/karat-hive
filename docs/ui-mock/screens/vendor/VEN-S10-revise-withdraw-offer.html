<section class="screen vendor-dense" data-screen="VEN-S10" data-title="Revise Offer">
  <div class="screen-block">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="screen-id-pill">Offer #OFF-2026-9921</span>
      <span class="status-chip status-offers">2 Revisions Left</span>
    </div>
    <h1 class="screen-heading">Revise / Withdraw Offer</h1>
    <div class="field-hint">Modify your pending offer for KH-RQ-2026-01482 (Max 3 revisions total).</div>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h2 class="section-title" style="font-size:1.1rem">Update Terms</h2>

    <div class="field">
      <label class="field-label">Offered Price (AED)</label>
      <input type="number" value="14700" style="font-size:1.1rem;font-weight:600;color:var(--gold-200)" />
      <div class="field-hint">Previous: AED 14,850</div>
    </div>

    <div class="field">
      <label class="field-label">Making Charges (AED)</label>
      <input type="number" value="400" />
    </div>

    <div class="field">
      <label class="field-label">Validity Period</label>
      <select>
        <option selected>24 Hours</option>
        <option>12 Hours</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="VEN-S11">Save Revised Offer →</button>
    <button type="button" class="btn btn-danger btn-block">Withdraw Offer Permanently</button>
    <button type="button" class="btn btn-secondary btn-block" data-nav="VEN-S11">Cancel</button>
  </div>
</section>
