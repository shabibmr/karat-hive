<section class="screen" data-screen="ADM-S18" data-title="Announcement Composer">
  <div class="screen-block">
    <div class="section-label">Broadcast Communications</div>
    <h1 class="screen-heading">Announcement Composer</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Broadcast system alerts or marketing notifications to Customers or Vendors.</p>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <div class="field">
      <label class="field-label">Target Audience <span class="field-hint">*</span></label>
      <select>
        <option selected>All Verified Vendors</option>
        <option>All Active Customers</option>
        <option>All Users</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Announcement Title <span class="field-hint">*</span></label>
      <input type="text" value="Gold Souk Holiday Hours &amp; Live Reference Rates Update" />
    </div>

    <div class="field">
      <label class="field-label">Message Body (English &amp; Arabic)</label>
      <textarea rows="4">Please note that official Yahoo Finance gold reference rates will be refreshed continuously during Eid holiday trading hours.</textarea>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-gold btn-block gold-light">Broadcast Announcement Now →</button>
    </div>
  </div>
</section>
