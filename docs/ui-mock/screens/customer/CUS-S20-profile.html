<section class="screen" data-screen="CUS-S20" data-title="Profile">
  <div class="screen-block" style="text-align:center;padding:1.5rem 0">
    <div style="width:80px;height:80px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--gold-400);overflow:hidden;background:var(--bg-surface);display:grid;place-items:center">
      <span style="font-size:2.2rem;color:var(--gold-200)">SA</span>
    </div>
    <h1 class="screen-heading" style="margin-bottom:4px">Sara Al Maktoum</h1>
    <div class="field-hint">Member since July 2026 · Dubai, UAE</div>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <h3 class="section-title" style="font-size:1.1rem">Account Details</h3>

    <div class="field">
      <label class="field-label">Display Name</label>
      <input type="text" value="Sara Al Maktoum" />
    </div>

    <div class="field">
      <label class="field-label">Mobile Number (Verified)</label>
      <input type="text" value="+971 50 123 4567" readonly />
    </div>

    <div class="field">
      <label class="field-label">Email Address</label>
      <input type="email" value="sara@example.ae" />
    </div>

    <div class="field">
      <label class="field-label">Default Region</label>
      <select>
        <option selected>Dubai</option>
        <option>Abu Dhabi</option>
        <option>Sharjah</option>
      </select>
    </div>
  </div>

  <div class="card card-luxury" style="margin-bottom:1.5rem">
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div>
        <div style="font-size:1.6rem;font-family:var(--font-display);color:var(--gold-200)">14</div>
        <div class="field-hint">Total Requests</div>
      </div>
      <div style="width:1px;background:var(--border-subtle)"></div>
      <div>
        <div style="font-size:1.6rem;font-family:var(--font-display);color:var(--gold-200)">8</div>
        <div class="field-hint">Connections</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light">Save Profile Edits</button>
    <button type="button" class="btn btn-secondary btn-block" data-nav="CUS-S21">Account Settings →</button>
  </div>
</section>
