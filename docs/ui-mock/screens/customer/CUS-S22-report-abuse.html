<section class="screen" data-screen="CUS-S22" data-title="Report Abuse">
  <div class="screen-block">
    <div class="section-label">Trust &amp; Safety</div>
    <h1 class="screen-heading">Report Abuse</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Report suspicious behavior, inappropriate messaging, or fake offers.</p>
  </div>

  <div class="card frame-deco" style="margin-bottom:1.5rem">
    <div class="field">
      <label class="field-label">Reason for Report <span class="field-hint">*</span></label>
      <select>
        <option selected>Inappropriate / Off-platform Payment Demand</option>
        <option>Misleading Gold Purity / Fake Images</option>
        <option>Unresponsive / Abusive Communication</option>
        <option>Identity Misrepresentation</option>
        <option>Other Policy Violation</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Detailed Explanation</label>
      <textarea rows="4" placeholder="Provide details, dates, or chat context to help our Trust & Safety team investigate..."></textarea>
      <div class="field-hint">Reports are handled confidentially by Platform Admin.</div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="CUS-S15">Submit Abuse Report →</button>
    <button type="button" class="btn btn-secondary btn-block" data-nav="CUS-S15">Cancel</button>
  </div>
</section>
