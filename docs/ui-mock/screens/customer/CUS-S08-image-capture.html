<section class="screen" data-screen="CUS-S08" data-title="Image Gallery & Picker">
  <div class="screen-block">
    <div class="section-label">Media Manager</div>
    <h1 class="screen-heading">Request Photos</h1>
    <p class="field-hint" style="margin-bottom:1.25rem">Upload up to 5 photos. First image is used as primary cover thumbnail.</p>
  </div>

  <div class="actions-row" style="margin-bottom:1.5rem">
    <button type="button" class="btn btn-secondary" style="flex:1">📷 Take Photo</button>
    <button type="button" class="btn btn-gold gold-light" style="flex:1">🖼️ Choose from Gallery</button>
  </div>

  <div class="form-section">
    <h2 class="section-title">Uploaded Images (2 of 5)</h2>
    <div class="list-stack">
      <div class="card" style="display:flex;align-items:center;gap:12px;padding:10px">
        <img src="assets/images/ornament.jpg" alt="Cover photo" style="width:64px;height:64px;object-fit:cover;border-radius:8px" />
        <div style="flex:1">
          <div style="display:flex;gap:6px;align-items:center">
            <strong>Photo_1.jpg</strong>
            <span class="status-chip status-published" style="font-size:0.6rem">Cover Photo</span>
          </div>
          <div class="field-hint" style="margin-top:2px">1.4 MB · Upload complete</div>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" style="color:var(--error)">Remove</button>
      </div>

      <div class="card" style="display:flex;align-items:center;gap:12px;padding:10px">
        <img src="assets/images/old-gold.jpg" alt="Side photo" style="width:64px;height:64px;object-fit:cover;border-radius:8px" />
        <div style="flex:1">
          <strong>Photo_2.jpg</strong>
          <div class="field-hint" style="margin-top:2px">2.1 MB · Upload complete</div>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" style="color:var(--error)">Remove</button>
      </div>

      <div class="slot-upload" style="min-height:72px">
        <span>+ Add Image 3</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-gold btn-block gold-light" data-nav="CUS-S09">Done &amp; Return to Request →</button>
  </div>
</section>
